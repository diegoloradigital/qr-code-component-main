<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">

  <title>Frontend Mentor | QR code component</title>
</head>

<body>

  <main>
    <article>
      <img src="./images/image-qr-code.png" alt="QR code that links you to Frontend Mentor's website">
      <h1><span class="nowrap">Improve your front-end</span> <span class="nowrap">skills by building projects</span>
      </h1>
      <p><span class="nowrap">Scan the QR code to visit Frontend</span> <span class="nowrap">Mentor and take your coding
          skills</span> <span class="nowrap">to the next level</span></p>
    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://www.frontendmentor.io/profile/diegoloradigital">Diego Lora</a>.
  </footer>

</body>

</html>
